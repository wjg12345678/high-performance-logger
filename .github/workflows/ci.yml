name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install smoke test
        run: bash scripts/install_smoke_test.sh

  external-benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install spdlog
        run: |
          sudo apt-get update
          sudo apt-get install -y libspdlog-dev

      - name: Configure
        run: cmake --preset dev

      - name: Build spdlog benchmark
        run: cmake --build --preset dev --target hlog_spdlog_compare_benchmark

      - name: Run spdlog benchmark smoke
        run: ./out/build/dev/hlog_spdlog_compare_benchmark 2 2000 1 0

  sanitizer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
          - name: tsan

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.name }}

      - name: Build
        run: cmake --build --preset ${{ matrix.name }}

      - name: Test
        run: ctest --preset ${{ matrix.name }}
